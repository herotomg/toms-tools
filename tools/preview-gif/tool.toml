id = "preview-gif"
name = "Preview GIF"
description = "Record preview GIFs of a UI with a visible cursor and visible clicks, for a README or PR."
version = "3"
next_steps = "Ask Claude Code for a preview GIF, or run `screengif --list`."

installs = [
  "~/.local/bin/screengif",
  "~/.local/share/toms-tools/preview-gif",
]
cleans = [
  "~/.claude/skills/preview-gif",
  "~/.codex/skills/preview-gif",
]

[[requires]]
command = "node"
fix = "brew install node"
why = "drives the browser for the preferred recording path"

[[requires]]
command = "ffmpeg"
fix = "brew install ffmpeg"
why = "converts the recording before it becomes a GIF"

[[requires]]
command = "gifski"
fix = "brew install gifski"
why = "encodes the GIF"

[[requires]]
command = "gifsicle"
fix = "brew install gifsicle"
why = "optimises the GIF so it fits in a README"
