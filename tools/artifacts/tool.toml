id = "artifacts"
name = "Artifacts"
description = "Publish Markdown or HTML to your tailnet as a page teammates can read and comment on."
version = "2"
next_steps = "Run `art serve` once to point Tailscale at the store, then `art publish notes.md`."

installs = [
  "~/.local/bin/art",
  "~/.local/share/toms-tools/artifacts",
]
cleans = [
  "~/.claude/skills/artifact-design",
  "~/.claude/skills/publish-artifact",
  "~/.codex/skills/artifact-design",
  "~/.codex/skills/publish-artifact",
]

[[requires]]
command = "uv"
fix = "brew install uv"
why = "runs the art CLI"

[[requires]]
command = "tailscale"
fix = "brew install --cask tailscale"
why = "serves your artifacts over the tailnet"
